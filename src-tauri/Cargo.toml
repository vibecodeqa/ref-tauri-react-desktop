[package]
name = "ref-tauri-react-desktop"
version = "0.1.0"
description = "Reference implementation for the VibeCode QA Tauri React Desktop standard."
authors = ["VibeCode QA"]
license = "MIT"
repository = "https://github.com/vibecodeqa/ref-tauri-react-desktop"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# `_lib` suffix keeps the library name distinct from the binary on every platform.
name = "ref_tauri_react_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No filesystem / shell / http / dialog / process plugin is a dependency, on purpose:
# the frontend has no plugin command it could use to reach the host. See SECURITY.md.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
